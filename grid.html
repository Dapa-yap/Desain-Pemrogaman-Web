<!DOCTYPE html>
<html>
<head>
    <title>Grid</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-size: 20px;
            font-family: arial;
            color: white;
            text-transform: uppercase;
            text-align: center;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            border: 5px solid #333;
            box-sizing: border-box;
            padding: 5px;
            display: grid;
            grid-template-areas: "header header"
                                 "aside main"
                                 "nav main"
                                 "footer footer";
            grid-template-columns: 1fr 1.5fr;
            grid-template-rows: 60px 1fr 1.5fr 60px;
        }
        
        header {
            grid-area: header;
            background-color: #0062D0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        aside {
            grid-area: aside;
            background-color: #2F93FF;
            padding: 60px 0;
        }

        nav {
            grid-area: nav;
            background-color: #0A5785;
            padding: 100px 0;
        }

        main {
            grid-area: main;
            background-color: #69AA77;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            grid-area: footer;
            background-color: #666;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Header</header>
        <aside>Aside</aside>
        <nav>Nav</nav>
        <main>Main</main>
        <footer>Footer</footer>
    </div>
</body>
</html>
